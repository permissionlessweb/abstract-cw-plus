[package]
name = "abstract-cw1-subkeys"
version = "3.0.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "Implement subkeys for authorizing native tokens as a cw1 proxy contract"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []
test-utils = []

[dependencies]
cosmwasm-schema        = { version = "3.0.4" }
cw-utils               = { path = "../../../cw-minus/packages/cw-utils" }
abstract-cw1           = { version = "1.2.2", path = "../../packages/cw1" }
abstract-cw2           = { version = "1.2.2", path = "../../packages/cw2" }
abstract-cw1-whitelist = { version = "3.0.0", path = "../cw1-whitelist", features = ["library"] }
cosmwasm-std           = { version = "3.0.4", features = ["staking"] }
cw-storage-plus        = { version = "3.0.1" }
schemars               = { version = "0.8.22" }
serde                  = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror              = { version = "1.0.69" }
semver                 = { version = "1" }
cw-orch                = { workspace = true }

[dev-dependencies]
easy-addr              = { workspace = true }
abstract-cw1-whitelist = { path = "../cw1-whitelist", features = ["library", "test-utils"] }