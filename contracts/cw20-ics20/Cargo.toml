[package]
name = "abstract-cw20-ics20"
version = "3.0.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "IBC Enabled contracts that receives CW20 tokens and sends them over ICS20 to a remote chain"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

[lib]
crate-type = ["cdylib", "rlib"]

[features]

# use library feature to disable all init/handle/query exports
library = []

[dependencies]
abstract-cw2     = { version = "1.2.2", path = "../../packages/cw2" }
abstract-cw20    = { version = "3.0.0", path = "../../packages/cw20" }
cosmwasm-schema = { path = "../../../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../cosmwasm/packages/std", features = ["stargate"] }
cw-controllers = { path = "../../../cw-minus/packages/controllers" }
cw-orch          = { workspace = true }
cw-storage-plus = { path = "../../../cw-storage-plus" }
cw-utils = { path = "../../../cw-minus/packages/cw-utils" }
schemars         = { version = "0.8.22" }
semver           = { version = "1" }
serde            = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror        = { version = "1.0.69" }

[dev-dependencies]
easy-addr        = { workspace = true }
