[package]
name = "abstract-cw4-stake"
version = "3.0.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "CW4 implementation of group based on staked tokens"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "artifacts/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for more explicit tests, cargo test --features=backtraces

# use library feature to disable all instantiate/execute/query exports
library = []


[dependencies]
cosmwasm-schema = { version = "3.0.0" }
cw-utils = { path = "../../../cw-minus/packages/cw-utils" }
abstract-cw2 = { version = "1.2.2", path = "../../packages/cw2" }
abstract-cw4 = { version = "1.2.2", path = "../../packages/cw4" }
abstract-cw20 = { version = "3.0.0", path = "../../packages/cw20" }
cw-controllers = { path = "../../../cw-minus/packages/controllers" }
cw-storage-plus = "3.0.0"
cosmwasm-std = { version = "3.0.0" }
schemars = "0.8"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.69" }
cw-orch = { workspace = true }
[dev-dependencies]
easy-addr = { workspace = true }