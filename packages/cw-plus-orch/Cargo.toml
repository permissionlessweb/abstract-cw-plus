[package]
name = "cw-plus-orch"
version = "0.25.0"                                                 # Version of cw-orch that's used
edition = "2021"
description = "CW4 implementation of group based on staked tokens"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
library = [
  "cw1-subkeys/library",
  "cw1-whitelist/library",
  "cw20-base/library",
  "cw20-ics20/library",
  "cw3-fixed-multisig/library",
  "cw3-flex-multisig/library",
  "cw4-group/library",
  "cw4-stake/library",
]

[dependencies]
cosmwasm-std = { path = "../../../ZK/cw/zk-cosmwasm/packages/std" }
cw-utils = { path = "../../../ZK/cw/zk-cw-minus/packages/cw-utils" }
cosmwasm-schema = { path = "../../../ZK/cw/zk-cosmwasm/packages/schema" }
cw-controllers = { path = "../../../ZK/cw/zk-cw-minus/packages/controllers" }

cw1 = { path = "../../../cw-plus/packages/cw1" }
cw1-subkeys = { path = "../../../cw-plus/contracts/cw1-subkeys" }
cw1-whitelist = { path = "../../../cw-plus/contracts/cw1-whitelist" }
cw3 = { path = "../../../cw-plus/packages/cw3" }
cw3-fixed-multisig = { path = "../../../cw-plus/contracts/cw3-fixed-multisig" }
cw3-flex-multisig = { path = "../../../cw-plus/contracts/cw3-flex-multisig" }
cw4 = { path = "../../../cw-plus/packages/cw4" }
cw4-group = { path = "../../../cw-plus/contracts/cw4-group" }
cw4-stake = { path = "../../../cw-plus/contracts/cw4-stake" }
cw20 = { path = "../../../cw-plus/packages/cw20" }
cw20-base = { path = "../../../cw-plus/contracts/cw20-base" }
cw20-ics20 = { path = "../../../cw-plus/contracts/cw20-ics20" }

cw-orch = { path = "../../../cw-orchestrator/cw-orch" }
cw-orch-from-interface-derive = { version = "0.1.0", path = "../from-interface-derive" }

[dev-dependencies]
cw-orch-interchain = { path = "../../../cw-orchestrator/cw-orch-interchain" }
