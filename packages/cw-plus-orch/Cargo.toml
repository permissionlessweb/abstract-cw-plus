[package]
name = "cw-plus-orch"
version = "0.25.0"                                                 # Version of cw-orch that's used
edition = "2021"
description = "CW4 implementation of group based on staked tokens"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
library = [
  "cw1-subkeys/library",
  "cw1-whitelist/library",
  "cw20-base/library",
  "cw20-ics20/library",
  "cw3-fixed-multisig/library",
  "cw3-flex-multisig/library",
  "cw4-group/library",
  "cw4-stake/library",
]

[dependencies]
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }

cw1 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw1-subkeys = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw1-whitelist = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw3 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw3-fixed-multisig = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw3-flex-multisig = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw4 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw4-group = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw4-stake = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-ics20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }

cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-from-interface-derive = { version = "0.1.0", path = "../from-interface-derive" }

[dev-dependencies]
cw-orch-interchain = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
