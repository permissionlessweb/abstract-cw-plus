[package]
name = "cw-plus-orch"
version = "0.25.0"                                                 # Version of cw-orch that's used
edition = "2021"
description = "CW4 implementation of group based on staked tokens"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"
documentation = "https://docs.cosmwasm.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
library = [
  "cw1-subkeys/library",
  "cw1-whitelist/library",
  "cw20-base/library",
  "cw20-ics20/library",
  "cw3-fixed-multisig/library",
  "cw3-flex-multisig/library",
  "cw4-group/library",
  "cw4-stake/library",
]

[dependencies]
cosmwasm-std                  = { version = "3.0.0" }
cw-utils                      = { version = "3.0.0" }
cosmwasm-schema               = { version = "3.0.0" }
cw-controllers                = { version = "3.0.0" }

cw1                           = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw1-subkeys                   = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw1-whitelist                 = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw3                           = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw3-fixed-multisig            = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw3-flex-multisig             = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw4                           = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw4-group                     = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw4-stake                     = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw20                          = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw20-base                     = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }
cw20-ics20                    = { version = "3.0.0", git = "https://github.com/permissionlessweb/cw-plus" }

cw-orch                       = { version = "0.30.0", git = "https://github.com/permissionlessweb/cw-orchestrator" }
cw-orch-from-interface-derive = { version = "0.1.0", path = "../from-interface-derive" }

[dev-dependencies]
cw-orch-interchain            = { version = "0.8.1", git = "https://github.com/permissionlessweb/cw-orchestrator" }
