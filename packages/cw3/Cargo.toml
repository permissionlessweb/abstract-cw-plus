[package]
name = "abstract-cw3"
version = "3.0.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "CosmWasm-3 Interface: On-Chain MultiSig/Voting contracts"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-plus"
homepage = "https://cosmwasm.com"

[dependencies]
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
abstract-cw20    = { version = "3.0.0", path = "../../packages/cw20" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
schemars         = { version = "0.8.22" }
serde            = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror        = { version = "1.0.69" }